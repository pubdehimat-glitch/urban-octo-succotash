name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and Fix All Code Errors
        run: |
          unzip -o SmartIDM.zip
          cp -r SmartIDM/* .
          
          # 1. إنشاء أيقونة التطبيق إذا كانت ناقصة
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          if [ ! -f app/src/main/res/drawable/ic_launcher_background.xml ]; then
            cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#1E88E5" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          fi

          if [ ! -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml ]; then
            cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
            cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          # 2. إصلاح ملف VideoExtractorEngine.kt بالكامل
          python3 - << 'PYEOF'
          import re
          p = "app/src/main/java/com/smartidm/downloader/engine/VideoExtractorEngine.kt"
          with open(p, "r", encoding="utf-8") as f:
              code = f.read()

          # استبدال جزء YoutubeDLRequest بالكامل باستدعاء مباشر متوافق مع المكتبة
          code = re.sub(
              r'val request = YoutubeDLRequest\(cleanUrl\).*?val info = YoutubeDL\.getInstance\(\)\.getInfo\(request\)',
              'val info = YoutubeDL.getInstance().getInfo(cleanUrl)',
              code,
              flags=re.DOTALL
          )

          # إصلاح دالة extractGenericVideoPage في نهاية الملف
          bad_part_start = code.find("private fun extractGenericVideoPage")
          if bad_part_start != -1:
              clean_function = '''private fun extractGenericVideoPage(url: String): ExtractedMedia? {
                  val html = fetchHtml(url, DESKTOP_UA) ?: return null
                  val title = Regex("""<title[^>]*>(.*?)</title>""", RegexOption.IGNORE_CASE)
                      .find(html)?.groupValues?.get(1)?.trim() ?: "Video"
                  val thumb = Regex("""property=["']og:image["']\\s+content=["']([^"']+)["']""", RegexOption.IGNORE_CASE)
                      .find(html)?.groupValues?.get(1)
                  val streams = mutableListOf<VideoStreamOption>()
                  val ogVideo = Regex("""property=["']og:video(?::url|:secure_url)?["']\\s+content=["']([^"']+)["']""", RegexOption.IGNORE_CASE)
                      .find(html)?.groupValues?.get(1)
                  if (!ogVideo.isNullOrBlank() && ogVideo.startsWith("http")) {
                      streams.add(VideoStreamOption("Direct Video", "MP4", ogVideo, isDirectMp4 = true))
                  }
                  Regex("""https?://[^"'\\s<>]+\\.(?:mp4|m3u8)(?:\\?[^"'\\s<>]*)?""", RegexOption.IGNORE_CASE)
                      .findAll(html)
                      .map { it.value.replace("\\\\/", "/") }
                      .distinct()
                      .take(6)
                      .forEachIndexed { idx, link ->
                          val isM3u8 = link.contains(".m3u8", ignoreCase = true)
                          streams.add(
                              VideoStreamOption(
                                  qualityLabel = if (isM3u8) "HLS Stream #${idx + 1}" else "MP4 Stream #${idx + 1}",
                                  format = if (isM3u8) "M3U8" else "MP4",
                                  url = link,
                                  isDirectMp4 = !isM3u8,
                                  isM3u8 = isM3u8
                              )
                          )
                      }
                  if (streams.isEmpty()) return null
                  return ExtractedMedia(
                      title = title,
                      sourceUrl = url,
                      platform = "Web",
                      thumbnailUrl = thumb,
                      streams = streams
                  )
              }
          }
          '''
              code = code[:bad_part_start] + clean_function

          with open(p, "w", encoding="utf-8") as f:
              f.write(code)
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartIDM-APK
          path: app/build/outputs/apk/debug/*.apk
